org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Never let AGP fetch SDK packages on its own: platform/build-tools install is an explicit, licensed step.
android.builder.sdkDownload=false

# Contest naming is <팀명>_<앱이름>_release.apk; override with -PapkBaseName=KKAEUM_깨움
apkBaseName=KKAEUM_kkaeum

# Pleos Playground > My Project credentials for TTS/STT HYBRID mode.
# Leave empty to run speech ON_DEVICE (no registration needed). Prefer $GRADLE_USER_HOME/gradle.properties or -P.
pleosClientId=
pleosClientSecret=
