<html><head><style>
@font-face{font-family:P;src:url(PretendardVariable.woff2) format('woff2');font-weight:100 900}
body{margin:0;font-family:P;letter-spacing:-.02em}
.row{display:flex;gap:28px;padding:40px 48px;align-items:center}
.dark{background:#000;color:#f5f5f7}.light{background:#f5f5f7;color:#1d1d1f}
.icon{width:220px;height:220px;border-radius:50px;display:flex;align-items:center;justify-content:center}
.icon.k{background:#000;box-shadow:0 0 0 1px #2a2c30}.icon.w{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.08)}
.icon img{width:132px}
.lock{display:flex;align-items:center;gap:22px}
.lock img{height:64px}
.lock b{font-size:62px;font-weight:700;letter-spacing:-.04em}
.lock span{display:block;font-size:20px;font-weight:500;opacity:.55;letter-spacing:.02em;margin-top:2px}
.sizes{display:flex;gap:26px;align-items:center}
</style></head><body>
<div class="row dark">
 <div class="icon k"><img src="mark_white.svg"></div>
 <div class="lock"><img src="mark_white.svg"><div><b>밸류링크</b><span>ValueLink</span></div></div>
 <div class="sizes"><img src="mark_white.svg" style="height:40px"><img src="mark_white.svg" style="height:24px"><img src="mark_white.svg" style="height:16px"></div>
</div>
<div class="row light">
 <div class="icon w"><img src="mark.svg"></div>
 <div class="lock"><img src="mark.svg"><div><b>밸류링크</b><span>ValueLink</span></div></div>
 <div class="sizes"><img src="mark.svg" style="height:40px"><img src="mark.svg" style="height:24px"><img src="mark.svg" style="height:16px"></div>
</div>
</body></html>
